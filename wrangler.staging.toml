# IMI ONE STAGING. Fully isolated from production: its own Worker, database,
# file bucket, secrets and Access protection. Synthetic data only. Live
# publishing is off (PUBLISHING_ENABLED is never set here).
#
# One address serves both the IMI ONE web app and its API, so the Access sign-in
# cookie works without cross-site setup:
#   https://imi-one-staging.<your-subdomain>.workers.dev
#
# Deploy only with founder approval:
#   ./scripts/stage-web.sh ../imi-one-web     (builds the app into ./staging-web)
#   npx wrangler deploy -c wrangler.staging.toml
name = "imi-one-staging"
main = "src/index.ts"
compatibility_date = "2026-07-17"

# The workers.dev address IS the staging address. It must have Cloudflare Access
# switched on (Settings > Domains & Routes > workers.dev > Enable Cloudflare Access)
# BEFORE the first real use; the Worker also refuses private requests without a
# verified Access identity. Preview URLs stay off so there is exactly one address.
workers_dev = true
preview_urls = false

# The built IMI ONE web app. Files are served as they are; every other path
# (/api, /v1, /oauth, /media, /public) runs the Worker.
[assets]
directory = "./staging-web"

[[d1_databases]]
binding = "DB"
database_name = "imi-db-staging"
# Create with: npx wrangler d1 create imi-db-staging   then paste its id here.
database_id = "59a52c37-1197-478b-86ad-2ed1dbbaa996"

[[r2_buckets]]
binding = "POSTERS"
bucket_name = "imi-posters-staging"

# Private Worker-to-Worker link to the staging CRM (never over the internet).
[[services]]
binding = "CRM_SERVICE"
service = "iddav-crm-staging"

[vars]
# Both values appear when you enable Cloudflare Access on the workers.dev address.
# Until both are set, every private request returns 503 (fail closed).
ACCESS_TEAM_DOMAIN = "still-firefly-2569.cloudflareaccess.com"
ACCESS_AUD = "dd214af24c746cd37d4cc7b774058895e28e53066f996698918bea2f6f564cea"
# Your email, lower case. Owner of everything in the old /api routes.
# The staging address itself, once known (same origin as the app).
APP_URL = "https://imi-one-staging.ramavaddi.workers.dev"
ENQUIRY_ORIGINS = ""
# Used only for the request path; the call goes through CRM_SERVICE.
CRM_URL = "https://iddav-crm-staging.internal"
DATA_ENVIRONMENT = "staging"
# Secrets (set with: npx wrangler secret put NAME -c wrangler.staging.toml):
#   CRM_SERVICE_KEY  = the staging CRM's IMI_FEED_KEY (new random value, never production's)
#   OWNER_PIN        = a new staging PIN
#   CONNECTIONS_KEY  = new random value (encrypts stored platform tokens)
# No platform client IDs, no AI keys: staging uses none of production's credentials.
