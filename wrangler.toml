name = "imi-backend"
main = "src/index.ts"
compatibility_date = "2026-07-17"

# Gate 1 (proposed, not active): once the app is served from one Access-protected
# custom domain, switch off the extra hostnames Access does not cover:
# workers_dev = false
# preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "imi-db"
database_id = "81146352-897e-4e7f-891e-8c9748abc2e0"

[[r2_buckets]]
binding = "POSTERS"
bucket_name = "imi-posters"

[vars]
ANTHROPIC_MODEL = "claude-sonnet-5-5"
OPENAI_TEXT_MODEL = "gpt-4o-mini"
OPENAI_IMAGE_MODEL = "gpt-image-2"
AI_MONTHLY_IMAGE_CAP = "60"
AI_MONTHLY_TEXT_CAP = "600"
# Set to your Pages URL so "Sign in with…" tabs can link back:
APP_URL = "https://imi-1o3.pages.dev"
# The Iddav CRM (DEC-IMI-003). IMI reads campaign results from it once the secret CRM_SERVICE_KEY is also set.
CRM_URL = "https://iddav-crm.ramavaddi.workers.dev"
