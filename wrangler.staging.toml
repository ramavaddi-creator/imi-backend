# STAGING: fully isolated from production. Separate Worker, database, media
# bucket and credentials; synthetic data only; live publishing off.
# Deploy only with founder approval:  npx wrangler deploy -c wrangler.staging.toml
name = "imi-backend-staging"
main = "src/index.ts"
compatibility_date = "2026-07-17"
# Reachable only through the staging custom domain behind its own Access app.
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "imi-db-staging"
# Create with: npx wrangler d1 create imi-db-staging   then paste its id here.
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "POSTERS"
bucket_name = "imi-posters-staging"

[vars]
# Fill in after creating the staging Access application. Until both are set,
# every private request returns 503 (fail closed).
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
OWNER_EMAILS = ""
APP_URL = ""
ENQUIRY_ORIGINS = ""
# PUBLISHING_ENABLED is deliberately absent: staging can never post for real.
# No CRM_URL, no platform client IDs, no AI keys: staging uses none of production's credentials.
